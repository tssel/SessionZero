<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SessionZero</title>
  <style>
    :root {
      --ink: #20231f;
      --muted: #74796f;
      --paper: #f7f7f2;
      --card: #ffffff;
      --line: #dddfd6;
      --accent: #315c45;
      --accent-soft: #e7efe9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, sans-serif;
    }

    button, input, textarea { font: inherit; }

    .app {
      width: min(560px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 48px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    nav { display: flex; gap: 6px; }

    .nav-button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px;
      cursor: pointer;
    }

    .nav-button.active {
      color: var(--ink);
      border-bottom: 2px solid var(--accent);
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .first-task {
      margin: 0 0 24px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
    }

    .eyebrow {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .first-task p { margin: 0; line-height: 1.5; }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input[type="text"], textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      padding: 13px 14px;
      outline: none;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
      line-height: 1.45;
    }

    .field { margin-bottom: 20px; }

    .primary, .secondary {
      min-height: 48px;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      border: 0;
      background: var(--accent);
      color: white;
      font-weight: 700;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .secondary {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
    }

    #timerScreen {
      text-align: center;
      padding-top: 40px;
    }

    .timer-goal {
      max-width: 440px;
      margin: 0 auto 32px;
      font-size: 20px;
      line-height: 1.4;
    }

    .clock {
      margin: 0 0 40px;
      font-size: 64px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.05em;
    }

    .timer-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 4px 0 24px;
    }

    .check-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .calendar-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .calendar-heading h2 {
      margin: 0;
      font-size: 18px;
    }

    .calendar-heading button {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--card);
      cursor: pointer;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin-bottom: 24px;
    }

    .weekday {
      padding: 6px 0;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    .day {
      aspect-ratio: 1;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      position: relative;
    }

    .day.empty { cursor: default; }

    .day.has-session {
      background: var(--accent-soft);
      font-weight: 700;
    }

    .day.selected {
      background: var(--accent);
      color: white;
    }

    .day small {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 3px;
      font-size: 9px;
      font-weight: 400;
    }

    .history-list { margin-bottom: 20px; }

    .history-list h3 {
      margin: 0 0 12px;
      font-size: 14px;
    }

    .session-card {
      margin-bottom: 10px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
    }

    .session-card p {
      margin: 6px 0;
      line-height: 1.4;
    }

    .session-card .meta {
      color: var(--muted);
      font-size: 12px;
    }

    .export-button { margin-top: 4px; }

    .previous-tasks {
      margin-top: 28px;
    }

    .previous-tasks h2 {
      margin: 0 0 10px;
      font-size: 14px;
    }

    .previous-task {
      width: 100%;
      margin-bottom: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      padding: 12px 14px;
      color: var(--ink);
      text-align: left;
      line-height: 1.4;
      cursor: pointer;
    }

    .previous-task .task-date {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 380px) {
      .app { padding: 18px 14px; }
      header { margin-bottom: 34px; }
      .clock { font-size: 52px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>SessionZero</h1>
      <nav aria-label="Main navigation">
        <button class="nav-button active" id="startNav" type="button">Start</button>
        <button class="nav-button" id="historyNav" type="button">History</button>
      </nav>
    </header>

    <section class="screen active" id="startScreen">
      <div class="first-task">
        <span class="eyebrow">First task</span>
        <p id="firstTaskText">None saved yet</p>
      </div>

      <div class="field">
        <label for="goalInput">Goal for this session (done when...)</label>
        <textarea id="goalInput" placeholder="I am done when..."></textarea>
      </div>

      <button class="primary" id="startButton" type="button" disabled>Start session</button>

      <div class="previous-tasks">
        <h2>Previous tasks</h2>
        <div id="previousTasksList"></div>
      </div>
    </section>

    <section class="screen" id="timerScreen">
      <p class="timer-goal" id="timerGoal"></p>
      <p class="clock" id="clock" aria-live="polite">00:00:00</p>
      <div class="timer-actions">
        <button class="secondary" id="pauseButton" type="button">Pause</button>
        <button class="primary" id="endButton" type="button">End</button>
      </div>
    </section>

    <section class="screen" id="endScreen">
      <div class="field">
        <label for="whatDoneInput">What I did</label>
        <textarea id="whatDoneInput"></textarea>
      </div>

      <div class="field">
        <label for="nextTaskInput">First task next time</label>
        <textarea id="nextTaskInput"></textarea>
      </div>

      <label class="check-row">
        <input type="checkbox" id="finishedInput">
        <span>Did something get finished?</span>
      </label>

      <button class="primary" id="saveButton" type="button" disabled>Save session</button>
    </section>

    <section class="screen" id="historyScreen">
      <div class="calendar-heading">
        <button id="previousMonth" type="button" aria-label="Previous month">&lsaquo;</button>
        <h2 id="monthTitle"></h2>
        <button id="nextMonth" type="button" aria-label="Next month">&rsaquo;</button>
      </div>
      <div class="calendar" id="calendar"></div>
      <div class="history-list" id="historyList"></div>
      <button class="secondary export-button" id="exportButton" type="button">Export to JSON</button>
    </section>
  </main>

  <script>
    const SESSIONS_KEY = "sessionZero.sessions";
    const TIMER_KEY = "sessionZero.timer";
    const NEXT_TASK_KEY = "sessionZero.nextTask";

    const oldKeys = {
      "doneWhen.sessions": SESSIONS_KEY,
      "doneWhen.timer": TIMER_KEY,
      "doneWhen.nextTask": NEXT_TASK_KEY
    };

    Object.entries(oldKeys).forEach(([oldKey, newKey]) => {
      if (!localStorage.getItem(newKey) && localStorage.getItem(oldKey) !== null) {
        localStorage.setItem(newKey, localStorage.getItem(oldKey));
      }
      localStorage.removeItem(oldKey);
    });

    const screens = {
      start: document.getElementById("startScreen"),
      timer: document.getElementById("timerScreen"),
      end: document.getElementById("endScreen"),
      history: document.getElementById("historyScreen")
    };

    const goalInput = document.getElementById("goalInput");
    const startButton = document.getElementById("startButton");
    const timerGoal = document.getElementById("timerGoal");
    const clock = document.getElementById("clock");
    const pauseButton = document.getElementById("pauseButton");
    const whatDoneInput = document.getElementById("whatDoneInput");
    const nextTaskInput = document.getElementById("nextTaskInput");
    const finishedInput = document.getElementById("finishedInput");
    const saveButton = document.getElementById("saveButton");

    let timer = readJSON(TIMER_KEY, null);
    let clockInterval = null;
    let calendarDate = new Date();
    let selectedDate = null;

    function readJSON(key, fallback) {
      try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
      } catch (error) {
        return fallback;
      }
    }

    function getSessions() {
      const sessions = readJSON(SESSIONS_KEY, []);
      return Array.isArray(sessions) ? sessions : [];
    }

    function saveSessions(sessions) {
      localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
    }

    function saveTimer() {
      localStorage.setItem(TIMER_KEY, JSON.stringify(timer));
    }

    function showScreen(name) {
      Object.entries(screens).forEach(([key, element]) => {
        element.classList.toggle("active", key === name);
      });

      document.getElementById("startNav").classList.toggle("active", name === "start");
      document.getElementById("historyNav").classList.toggle("active", name === "history");
    }

    function updateFirstTask() {
      const nextTask = localStorage.getItem(NEXT_TASK_KEY);
      document.getElementById("firstTaskText").textContent = nextTask || "None saved yet";
      renderPreviousTasks();
    }

    function renderPreviousTasks() {
      const list = document.getElementById("previousTasksList");
      const sessions = getSessions();
      list.innerHTML = "";

      if (!sessions.length) {
        list.innerHTML = "<p>No previous tasks yet</p>";
        return;
      }

      [...sessions].reverse().forEach(session => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "previous-task";
        button.textContent = session.nextTask || session.goal || "";

        const date = document.createElement("span");
        date.className = "task-date";
        const [year, month, day] = String(session.date).split("-").map(Number);
        date.textContent = new Date(year, month - 1, day).toLocaleDateString(undefined, {
          month: "short",
          day: "numeric",
          year: "numeric"
        });
        button.appendChild(date);

        button.addEventListener("click", () => {
          goalInput.value = session.nextTask || session.goal || "";
          startButton.disabled = goalInput.value.trim().length === 0;
          goalInput.focus();
        });

        list.appendChild(button);
      });
    }

    function elapsedMilliseconds() {
      if (!timer) return 0;
      const runningTime = timer.paused ? 0 : Date.now() - timer.startedAt;
      return timer.elapsedBeforePause + runningTime;
    }

    function formatTime(milliseconds) {
      const totalSeconds = Math.max(0, Math.floor(milliseconds / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return [hours, minutes, seconds]
        .map(value => String(value).padStart(2, "0"))
        .join(":");
    }

    function updateClock() {
      clock.textContent = formatTime(elapsedMilliseconds());
    }

    function startClock() {
      clearInterval(clockInterval);
      updateClock();
      if (timer && !timer.paused) {
        clockInterval = setInterval(updateClock, 250);
      }
    }

    goalInput.addEventListener("input", () => {
      startButton.disabled = goalInput.value.trim().length === 0;
    });

    startButton.addEventListener("click", () => {
      const goal = goalInput.value.trim();
      if (!goal) return;

      timer = {
        goal,
        startedAt: Date.now(),
        elapsedBeforePause: 0,
        paused: false
      };
      saveTimer();
      timerGoal.textContent = goal;
      pauseButton.textContent = "Pause";
      showScreen("timer");
      startClock();
    });

    pauseButton.addEventListener("click", () => {
      if (!timer) return;

      if (timer.paused) {
        timer.startedAt = Date.now();
        timer.paused = false;
        pauseButton.textContent = "Pause";
        startClock();
      } else {
        timer.elapsedBeforePause = elapsedMilliseconds();
        timer.paused = true;
        pauseButton.textContent = "Resume";
        clearInterval(clockInterval);
        updateClock();
      }
      saveTimer();
    });

    document.getElementById("endButton").addEventListener("click", () => {
      if (!timer) return;
      if (!timer.paused) {
        timer.elapsedBeforePause = elapsedMilliseconds();
        timer.paused = true;
      }
      saveTimer();
      whatDoneInput.value = "";
      nextTaskInput.value = "";
      finishedInput.checked = false;
      saveButton.disabled = true;
      showScreen("end");
    });

    function updateSaveButton() {
      saveButton.disabled =
        whatDoneInput.value.trim().length === 0 ||
        nextTaskInput.value.trim().length === 0;
    }

    whatDoneInput.addEventListener("input", updateSaveButton);
    nextTaskInput.addEventListener("input", updateSaveButton);

    saveButton.addEventListener("click", () => {
      if (!timer) return;
      const whatDone = whatDoneInput.value.trim();
      const nextTask = nextTaskInput.value.trim();
      if (!whatDone || !nextTask) return;

      const elapsedMinutes = Math.max(1, Math.ceil(elapsedMilliseconds() / 60000));
      const today = new Date();
      const date = [
        today.getFullYear(),
        String(today.getMonth() + 1).padStart(2, "0"),
        String(today.getDate()).padStart(2, "0")
      ].join("-");

      const sessions = getSessions();
      sessions.push({
        date,
        minutes: elapsedMinutes,
        goal: timer.goal,
        whatDid: whatDone,
        nextTask,
        finished: finishedInput.checked
      });
      saveSessions(sessions);
      localStorage.setItem(NEXT_TASK_KEY, nextTask);

      timer = null;
      localStorage.removeItem(TIMER_KEY);
      goalInput.value = "";
      startButton.disabled = true;
      updateFirstTask();
      showScreen("start");
    });

    document.getElementById("startNav").addEventListener("click", () => {
      updateFirstTask();
      showScreen(timer ? "timer" : "start");
    });

    document.getElementById("historyNav").addEventListener("click", () => {
      renderCalendar();
      showScreen("history");
    });

    function toDateKey(year, month, day) {
      return [
        year,
        String(month + 1).padStart(2, "0"),
        String(day).padStart(2, "0")
      ].join("-");
    }

    function formatMonth(date) {
      return date.toLocaleDateString(undefined, {
        month: "long",
        year: "numeric"
      });
    }

    function renderCalendar() {
      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const sessions = getSessions();

      document.getElementById("monthTitle").textContent = formatMonth(calendarDate);

      const totals = {};
      sessions.forEach(session => {
        totals[session.date] = (totals[session.date] || 0) + Number(session.minutes || 0);
      });

      const calendar = document.getElementById("calendar");
      calendar.innerHTML = "";

      ["S", "M", "T", "W", "T", "F", "S"].forEach(day => {
        const label = document.createElement("div");
        label.className = "weekday";
        label.textContent = day;
        calendar.appendChild(label);
      });

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "day empty";
        calendar.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = toDateKey(year, month, day);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "day";
        button.textContent = day;

        if (totals[dateKey]) {
          button.classList.add("has-session");
          const total = document.createElement("small");
          total.textContent = totals[dateKey] + "m";
          button.appendChild(total);
        }

        if (selectedDate === dateKey) button.classList.add("selected");

        button.addEventListener("click", () => {
          selectedDate = dateKey;
          renderCalendar();
          renderDaySessions(dateKey);
        });
        calendar.appendChild(button);
      }

      if (!selectedDate) {
        document.getElementById("historyList").innerHTML =
          "<h3>Select a day to see sessions</h3>";
      } else {
        renderDaySessions(selectedDate);
      }
    }

    function renderDaySessions(dateKey) {
      const sessions = getSessions().filter(session => session.date === dateKey);
      const list = document.getElementById("historyList");

      const [year, month, day] = dateKey.split("-").map(Number);
      const titleDate = new Date(year, month - 1, day).toLocaleDateString(undefined, {
        month: "long",
        day: "numeric",
        year: "numeric"
      });

      if (!sessions.length) {
        list.innerHTML = "<h3>" + titleDate + "</h3><p>No sessions.</p>";
        return;
      }

      list.innerHTML = "<h3>" + titleDate + "</h3>";
      sessions.forEach(session => {
        const card = document.createElement("article");
        card.className = "session-card";
        card.innerHTML =
          "<p class=\"meta\">" + Number(session.minutes) + " minutes - " +
          (session.finished ? "Finished: yes" : "Finished: no") + "</p>" +
          "<p><strong>Goal:</strong> " + escapeHTML(session.goal) + "</p>" +
          "<p><strong>What I did:</strong> " + escapeHTML(session.whatDid) + "</p>";
        list.appendChild(card);
      });
    }

    function escapeHTML(value) {
      const element = document.createElement("div");
      element.textContent = value == null ? "" : String(value);
      return element.innerHTML;
    }

    document.getElementById("previousMonth").addEventListener("click", () => {
      calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() - 1, 1);
      selectedDate = null;
      renderCalendar();
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
      calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() + 1, 1);
      selectedDate = null;
      renderCalendar();
    });

    document.getElementById("exportButton").addEventListener("click", () => {
      const sessions = getSessions();
      const blob = new Blob([JSON.stringify(sessions, null, 2)], {
        type: "application/json"
      });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "sessionzero-sessions.json";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    });

    updateFirstTask();

    if (timer) {
      timerGoal.textContent = timer.goal;
      pauseButton.textContent = timer.paused ? "Resume" : "Pause";
      showScreen("timer");
      startClock();
    } else {
      showScreen("start");
    }

    renderCalendar();
  </script>
</body>
</html>
