<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SessionZero</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      --app-background: #FAFAF9;
      --app-surface: #FFFFFF;
      --app-border: #E7E5E4;
      --app-text: #1C1917;
      --app-muted: #78716C;
      --app-accent: #4F46E5;
      --app-accent-content: #FFFFFF;
      --app-success: #16A34A;
      --app-action: #00AD1A;
      --app-action-hover: #009A16;
      --app-action-active: #008314;
      --app-action-content: #FFFFFF;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --app-background: #0F0F10;
        --app-surface: #18181B;
        --app-border: #27272A;
        --app-text: #FAFAFA;
        --app-muted: #A1A1AA;
        --app-accent: #818CF8;
        --app-accent-content: #0F0F10;
        --app-success: #4ADE80;
      }
    }

    .screen { display: none; }
    .screen.active { display: block; }

    body {
      background: var(--app-background);
      color: var(--app-text);
    }

    .card,
    .textarea,
    .session-card {
      background: var(--app-surface);
      border-color: var(--app-border);
    }

    .text-base-content\/60,
    .text-base-content\/60 * {
      color: var(--app-muted);
    }

    body .btn,
    body .tab,
    body .previous-task-select {
      font-family: inherit;
    }

    body .btn.btn-primary {
      background: var(--app-action);
      border-color: var(--app-action);
      color: var(--app-action-content);
    }

    body .btn.btn-primary:hover:not(:disabled):not([disabled]) {
      background: var(--app-action-hover);
      border-color: var(--app-action-hover);
    }

    body .btn.btn-primary:active:not(:disabled):not([disabled]) {
      background: var(--app-action-active);
      border-color: var(--app-action-active);
    }

    body .btn-outline,
    body .btn-ghost:not(.btn-primary),
    body .previous-task-select {
      color: var(--app-text);
      border-color: var(--app-border);
      background: var(--app-surface);
    }

    body .btn-error,
    body .delete-previous-task {
      color: var(--app-text);
      border-color: var(--app-border);
      background: var(--app-surface);
    }

    body .btn:disabled,
    body .btn[disabled] {
      opacity: 0.45;
      color: var(--app-muted);
      border-color: var(--app-border);
      background: var(--app-surface);
    }

    body .btn.btn-primary:disabled,
    body .btn.btn-primary[disabled] {
      color: var(--app-muted);
      background: var(--app-surface);
      border-color: var(--app-border);
    }

    body .tab {
      color: var(--app-muted);
      border-color: transparent;
    }

    body .tab.tab-active {
      color: var(--app-text);
      border-color: var(--app-accent);
    }

    body .checkbox-primary {
      --chkbg: var(--app-accent);
      --chkfg: var(--app-accent-content);
    }

    .tabs {
      color: var(--app-muted);
      border-color: var(--app-border);
    }

    .tab-active {
      color: var(--app-text);
    }

    .success-text {
      color: var(--app-success);
    }

    .btn,
    .input,
    .textarea,
    .checkbox,
    .tabs,
    .tab {
      transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
    }

    body .input,
    body .textarea {
      color: var(--app-text);
      background: var(--app-surface);
      border-color: var(--app-border);
    }

    body .select {
      color: var(--app-text);
      background: var(--app-surface);
      border-color: var(--app-border);
    }

    body .input::placeholder,
    body .textarea::placeholder {
      color: var(--app-muted);
    }

    body .join .btn {
      color: var(--app-muted);
      background: var(--app-surface);
      border-color: var(--app-border);
    }

    body .join .btn:checked {
      color: var(--app-action-content);
      background: var(--app-action);
      border-color: var(--app-action);
    }

    body .join .btn:checked:hover {
      background: var(--app-action-hover);
      border-color: var(--app-action-hover);
    }

    body .join .btn:checked:active {
      background: var(--app-action-active);
      border-color: var(--app-action-active);
    }

    body .checkbox {
      border-color: var(--app-border);
    }
  </style>
</head>
<body class="min-h-screen">
  <main class="mx-auto flex min-h-screen w-full max-w-[560px] flex-col px-5 py-6">
    <header class="mb-12 flex items-center justify-between">
      <h1 class="text-xl font-bold tracking-tight">SessionZero</h1>
      <nav class="tabs tabs-border" aria-label="Main navigation">
        <button class="tab tab-active" id="startNav" type="button">Start</button>
        <button class="tab" id="historyNav" type="button">History</button>
      </nav>
    </header>

    <section class="screen active" id="startScreen">
      <div class="card mb-6 border border-base-300 bg-base-100 shadow-sm">
        <div class="card-body p-4">
          <span class="mb-2 text-xs font-bold uppercase tracking-widest text-base-content/60">First task</span>
          <p id="firstTaskText" class="leading-relaxed">None saved yet</p>
        </div>
      </div>

      <div class="mb-5">
        <label class="label mb-2 font-bold" for="goalInput">Goal for this session (done when...)</label>
        <textarea class="textarea textarea-bordered min-h-24 w-full" id="goalInput" placeholder="I am done when..."></textarea>
      </div>

      <fieldset class="mb-5">
        <legend class="label mb-2 font-bold">Session type</legend>
        <div class="join w-full">
          <input class="btn join-item flex-1" type="radio" name="timerMode" id="stopwatchMode" value="stopwatch" aria-label="Stopwatch" checked>
          <input class="btn join-item flex-1" type="radio" name="timerMode" id="countdownMode" value="countdown" aria-label="Timer">
        </div>
      </fieldset>

      <div class="mb-5 hidden" id="timerDurationField">
        <label class="label mb-2 font-bold" for="timerDurationInput">Timer duration</label>
        <input class="input input-bordered w-full" id="timerDurationInput" type="number" min="1" max="1440" step="1" value="25" aria-describedby="timerDurationHint">
        <span class="mt-2 block text-xs text-base-content/60" id="timerDurationHint">Minutes</span>
      </div>

      <button class="btn btn-primary w-full" id="startButton" type="button" disabled>Start session</button>

      <div class="mt-7">
        <h2 class="mb-3 text-sm font-bold">Previous tasks</h2>
        <div id="previousTasksList"></div>
      </div>
    </section>

    <section class="screen pt-10 text-center" id="timerScreen">
      <p class="mx-auto mb-8 max-w-[440px] text-xl leading-relaxed" id="timerGoal"></p>
      <p class="mb-10 text-6xl font-light tracking-tight tabular-nums" id="clock" aria-live="polite">00:00:00</p>
      <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-3">
        <button class="btn btn-outline" id="pauseButton" type="button">Pause</button>
        <button class="btn btn-circle btn-outline size-11" id="subtractMinuteButton" type="button" aria-label="Subtract minutes" title="Subtract minutes">-</button>
        <button class="btn btn-outline" id="endButton" type="button">End</button>
      </div>
    </section>

    <section class="screen" id="endScreen">
      <div class="mb-5">
        <label class="label mb-2 font-bold" for="whatDoneInput">What I did</label>
        <textarea class="textarea textarea-bordered min-h-24 w-full" id="whatDoneInput"></textarea>
      </div>

      <div class="mb-5">
        <label class="label mb-2 font-bold" for="nextTaskInput">First task next time</label>
        <textarea class="textarea textarea-bordered min-h-24 w-full" id="nextTaskInput"></textarea>
      </div>

      <label class="mb-6 flex items-center gap-3">
        <input class="checkbox checkbox-primary" type="checkbox" id="finishedInput">
        <span>Did something get finished?</span>
      </label>

      <button class="btn btn-primary w-full" id="saveButton" type="button" disabled>Save session</button>
    </section>

    <section class="screen" id="historyScreen">
      <div class="mb-4 flex items-center justify-between">
        <button class="btn btn-circle btn-ghost" id="previousMonth" type="button" aria-label="Previous month">&lsaquo;</button>
        <h2 class="text-lg font-bold" id="monthTitle"></h2>
        <button class="btn btn-circle btn-ghost" id="nextMonth" type="button" aria-label="Next month">&rsaquo;</button>
      </div>
      <div class="mb-6 grid grid-cols-7 gap-1" id="calendar"></div>
      <div class="mb-5" id="historyList"></div>
      <div class="flex gap-2">
        <button class="btn btn-outline" id="importButton" type="button">Import JSON</button>
        <button class="btn btn-outline" id="exportButton" type="button">Export to JSON</button>
      </div>
      <input id="importFileInput" type="file" accept="application/json,.json" hidden>
    </section>
  </main>

  <script>
    const SESSIONS_KEY = "sessionZero.sessions";
    const TIMER_KEY = "sessionZero.timer";
    const NEXT_TASK_KEY = "sessionZero.nextTask";

    const oldKeys = {
      "doneWhen.sessions": SESSIONS_KEY,
      "doneWhen.timer": TIMER_KEY,
      "doneWhen.nextTask": NEXT_TASK_KEY
    };

    Object.entries(oldKeys).forEach(([oldKey, newKey]) => {
      if (!localStorage.getItem(newKey) && localStorage.getItem(oldKey) !== null) {
        localStorage.setItem(newKey, localStorage.getItem(oldKey));
      }
      localStorage.removeItem(oldKey);
    });

    const screens = {
      start: document.getElementById("startScreen"),
      timer: document.getElementById("timerScreen"),
      end: document.getElementById("endScreen"),
      history: document.getElementById("historyScreen")
    };

    const goalInput = document.getElementById("goalInput");
    const startButton = document.getElementById("startButton");
    const timerGoal = document.getElementById("timerGoal");
    const clock = document.getElementById("clock");
    const pauseButton = document.getElementById("pauseButton");
    const whatDoneInput = document.getElementById("whatDoneInput");
    const nextTaskInput = document.getElementById("nextTaskInput");
    const finishedInput = document.getElementById("finishedInput");
    const saveButton = document.getElementById("saveButton");
    const stopwatchMode = document.getElementById("stopwatchMode");
    const countdownMode = document.getElementById("countdownMode");
    const timerDurationField = document.getElementById("timerDurationField");
    const timerDurationInput = document.getElementById("timerDurationInput");
    const subtractMinuteButton = document.getElementById("subtractMinuteButton");

    let timer = readJSON(TIMER_KEY, null);
    let clockInterval = null;
    let calendarDate = new Date();
    let selectedDate = null;

    function readJSON(key, fallback) {
      try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
      } catch (error) {
        return fallback;
      }
    }

    function getSessions() {
      const sessions = readJSON(SESSIONS_KEY, []);
      return Array.isArray(sessions) ? sessions : [];
    }

    function saveSessions(sessions) {
      localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
    }

    function saveTimer() {
      localStorage.setItem(TIMER_KEY, JSON.stringify(timer));
    }

    function showScreen(name) {
      Object.entries(screens).forEach(([key, element]) => {
        element.classList.toggle("active", key === name);
      });

      document.getElementById("startNav").classList.toggle("tab-active", name === "start");
      document.getElementById("historyNav").classList.toggle("tab-active", name === "history");

      if (name !== "timer") {
        document.title = "SessionZero";
      }
    }

    function updateFirstTask() {
      const nextTask = localStorage.getItem(NEXT_TASK_KEY);
      document.getElementById("firstTaskText").textContent = nextTask || "None saved yet";
      renderPreviousTasks();
    }

    function renderPreviousTasks() {
      const list = document.getElementById("previousTasksList");
      const sessions = getSessions();
      list.innerHTML = "";

      if (!sessions.length) {
        list.innerHTML = '<p class="text-base-content/60">No previous tasks yet</p>';
        return;
      }

      [...sessions].reverse().forEach((session, reverseIndex) => {
        const row = document.createElement("div");
        row.className = "card mb-2 grid grid-cols-[minmax(0,1fr)_auto] items-center border border-base-300 bg-base-100";

        const selectButton = document.createElement("button");
        selectButton.type = "button";
        selectButton.className = "w-full bg-transparent px-4 py-3 text-left leading-relaxed";
        selectButton.textContent = session.nextTask || session.goal || "";

        const date = document.createElement("span");
        date.className = "mt-1 block text-xs text-base-content/60";
        const [year, month, day] = String(session.date).split("-").map(Number);
        date.textContent = new Date(year, month - 1, day).toLocaleDateString(undefined, {
          month: "short",
          day: "numeric",
          year: "numeric"
        });
        selectButton.appendChild(date);

        selectButton.addEventListener("click", () => {
          goalInput.value = session.nextTask || session.goal || "";
          startButton.disabled = goalInput.value.trim().length === 0;
          goalInput.focus();
        });

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "btn btn-error btn-outline btn-sm mr-2";
        deleteButton.textContent = "Delete";
        deleteButton.setAttribute("aria-label", `Delete previous task: ${session.nextTask || session.goal || "Untitled task"}`);
        deleteButton.addEventListener("click", () => {
          if (!window.confirm("Delete this previous task?")) return;

          const originalIndex = sessions.length - 1 - reverseIndex;
          sessions.splice(originalIndex, 1);
          saveSessions(sessions);

          const latestSession = [...sessions].reverse().find(item => item.nextTask);
          if (latestSession) {
            localStorage.setItem(NEXT_TASK_KEY, latestSession.nextTask);
          } else {
            localStorage.removeItem(NEXT_TASK_KEY);
          }

          updateFirstTask();
        });

        row.appendChild(selectButton);
        row.appendChild(deleteButton);
        list.appendChild(row);
      });
    }

    function elapsedMilliseconds() {
      if (!timer) return 0;
      const runningTime = timer.paused ? 0 : Date.now() - timer.startedAt;
      return timer.elapsedBeforePause + runningTime;
    }

    function formatTime(milliseconds) {
      const totalSeconds = Math.max(0, Math.floor(milliseconds / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return [hours, minutes, seconds]
        .map(value => String(value).padStart(2, "0"))
        .join(":");
    }

    function updateClock() {
      if (!timer) return;

      if (timer.mode === "countdown") {
        const remainingMilliseconds = timer.durationMilliseconds - elapsedMilliseconds();
        if (remainingMilliseconds < 0) {
          clock.textContent = "+" + formatTime(Math.abs(remainingMilliseconds));
        } else {
          clock.textContent = formatTime(remainingMilliseconds);
        }
      } else {
        clock.textContent = formatTime(elapsedMilliseconds());
      }

      document.title = timer.paused
        ? "Paused - " + clock.textContent + " - SessionZero"
        : clock.textContent + " - SessionZero";
    }

    function startClock() {
      clearInterval(clockInterval);
      updateClock();
      if (timer && !timer.paused) {
        clockInterval = setInterval(updateClock, 250);
      }
    }

    goalInput.addEventListener("input", () => {
      startButton.disabled = goalInput.value.trim().length === 0;
    });

    [stopwatchMode, countdownMode].forEach(modeInput => {
      modeInput.addEventListener("change", () => {
        timerDurationField.classList.toggle("hidden", !countdownMode.checked);
      });
    });

    subtractMinuteButton.addEventListener("click", () => {
      if (!timer) return;
      const answer = window.prompt("How many minutes should be subtracted?", "1");
      if (answer === null) return;

      const minutesToSubtract = Number(answer);
      if (!Number.isFinite(minutesToSubtract) || minutesToSubtract <= 0) {
        window.alert("Enter a number greater than 0.");
        return;
      }

      timer.elapsedBeforePause = Math.max(0, elapsedMilliseconds() - minutesToSubtract * 60000);
      timer.startedAt = Date.now();
      saveTimer();
      updateClock();
    });

    startButton.addEventListener("click", () => {
      const goal = goalInput.value.trim();
      if (!goal) return;

      const mode = countdownMode.checked ? "countdown" : "stopwatch";
      const durationMinutes = Math.min(1440, Math.max(1, Number(timerDurationInput.value) || 25));

      timer = {
        goal,
        mode,
        durationMilliseconds: mode === "countdown" ? durationMinutes * 60000 : 0,
        startedAt: Date.now(),
        elapsedBeforePause: 0,
        paused: false
      };
      saveTimer();
      timerGoal.textContent = goal;
      pauseButton.textContent = "Pause";
      showScreen("timer");
      startClock();
    });

    pauseButton.addEventListener("click", () => {
      if (!timer) return;

      if (timer.paused) {
        timer.startedAt = Date.now();
        timer.paused = false;
        pauseButton.textContent = "Pause";
        startClock();
      } else {
        timer.elapsedBeforePause = elapsedMilliseconds();
        timer.paused = true;
        pauseButton.textContent = "Resume";
        clearInterval(clockInterval);
        updateClock();
      }
      saveTimer();
    });

    document.getElementById("endButton").addEventListener("click", () => {
      if (!timer) return;
      if (!timer.paused) {
        timer.elapsedBeforePause = elapsedMilliseconds();
        timer.paused = true;
      }
      saveTimer();
      whatDoneInput.value = "";
      nextTaskInput.value = "";
      finishedInput.checked = false;
      saveButton.disabled = true;
      showScreen("end");
    });

    function updateSaveButton() {
      saveButton.disabled =
        whatDoneInput.value.trim().length === 0 ||
        nextTaskInput.value.trim().length === 0;
    }

    whatDoneInput.addEventListener("input", updateSaveButton);
    nextTaskInput.addEventListener("input", updateSaveButton);

    saveButton.addEventListener("click", () => {
      if (!timer) return;
      const whatDone = whatDoneInput.value.trim();
      const nextTask = nextTaskInput.value.trim();
      if (!whatDone || !nextTask) return;

      const elapsedMinutes = Math.max(1, Math.ceil(elapsedMilliseconds() / 60000));
      const today = new Date();
      const date = [
        today.getFullYear(),
        String(today.getMonth() + 1).padStart(2, "0"),
        String(today.getDate()).padStart(2, "0")
      ].join("-");

      const sessions = getSessions();
      sessions.push({
        date,
        minutes: elapsedMinutes,
        goal: timer.goal,
        whatDid: whatDone,
        nextTask,
        finished: finishedInput.checked
      });
      saveSessions(sessions);
      localStorage.setItem(NEXT_TASK_KEY, nextTask);

      timer = null;
      localStorage.removeItem(TIMER_KEY);
      goalInput.value = "";
      startButton.disabled = true;
      updateFirstTask();
      showScreen("start");
    });

    document.getElementById("startNav").addEventListener("click", () => {
      updateFirstTask();
      showScreen(timer ? "timer" : "start");
    });

    document.getElementById("historyNav").addEventListener("click", () => {
      renderCalendar();
      showScreen("history");
    });

    function toDateKey(year, month, day) {
      return [
        year,
        String(month + 1).padStart(2, "0"),
        String(day).padStart(2, "0")
      ].join("-");
    }

    function formatMonth(date) {
      return date.toLocaleDateString(undefined, {
        month: "long",
        year: "numeric"
      });
    }

    function renderCalendar() {
      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const sessions = getSessions();

      document.getElementById("monthTitle").textContent = formatMonth(calendarDate);

      const totals = {};
      sessions.forEach(session => {
        totals[session.date] = (totals[session.date] || 0) + Number(session.minutes || 0);
      });

      const calendar = document.getElementById("calendar");
      calendar.innerHTML = "";

      ["S", "M", "T", "W", "T", "F", "S"].forEach(day => {
        const label = document.createElement("div");
        label.className = "py-2 text-center text-xs text-base-content/60";
        label.textContent = day;
        calendar.appendChild(label);
      });

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "aspect-square";
        calendar.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = toDateKey(year, month, day);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "btn btn-ghost aspect-square h-auto min-h-0 p-0";
        button.textContent = day;

        if (totals[dateKey]) {
          button.classList.add("btn-primary");
          const total = document.createElement("small");
          total.className = "absolute bottom-1 text-[9px]";
          total.textContent = totals[dateKey] + "m";
          button.appendChild(total);
        }

        if (selectedDate === dateKey) button.classList.add("btn-primary");

        button.addEventListener("click", () => {
          selectedDate = dateKey;
          renderCalendar();
          renderDaySessions(dateKey);
        });
        calendar.appendChild(button);
      }

      if (!selectedDate) {
        document.getElementById("historyList").innerHTML =
          "<h3>Select a day to see sessions</h3>";
      } else {
        renderDaySessions(selectedDate);
      }
    }

    function renderDaySessions(dateKey) {
      const sessions = getSessions().filter(session => session.date === dateKey);
      const list = document.getElementById("historyList");

      const [year, month, day] = dateKey.split("-").map(Number);
      const titleDate = new Date(year, month - 1, day).toLocaleDateString(undefined, {
        month: "long",
        day: "numeric",
        year: "numeric"
      });

      if (!sessions.length) {
        list.innerHTML = '<h3 class="mb-3 text-sm font-bold">' + titleDate + "</h3><p>No sessions.</p>";
        return;
      }

      list.innerHTML = '<h3 class="mb-3 text-sm font-bold">' + titleDate + "</h3>";
      sessions.forEach(session => {
        const card = document.createElement("article");
        card.className = "card mb-3 border border-base-300 bg-base-100 p-4";
        const finishedText = session.finished
          ? '<span class="success-text">Finished: yes</span>'
          : "Finished: no";
        card.innerHTML =
          '<p class="mb-2 text-xs text-base-content/60">' + Number(session.minutes) + " minutes - " +
          finishedText + "</p>" +
          '<p class="mb-2 leading-relaxed"><strong>Goal:</strong> ' + escapeHTML(session.goal) + "</p>" +
          '<p class="leading-relaxed"><strong>What I did:</strong> ' + escapeHTML(session.whatDid) + "</p>";
        list.appendChild(card);
      });
    }

    function escapeHTML(value) {
      const element = document.createElement("div");
      element.textContent = value == null ? "" : String(value);
      return element.innerHTML;
    }

    document.getElementById("previousMonth").addEventListener("click", () => {
      calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() - 1, 1);
      selectedDate = null;
      renderCalendar();
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
      calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() + 1, 1);
      selectedDate = null;
      renderCalendar();
    });

    const importFileInput = document.getElementById("importFileInput");

    document.getElementById("importButton").addEventListener("click", () => {
      importFileInput.value = "";
      importFileInput.click();
    });

    importFileInput.addEventListener("change", async () => {
      const file = importFileInput.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        window.alert("This file is too large. Choose a JSON file smaller than 5 MB.");
        return;
      }

      try {
        const parsed = JSON.parse(await file.text());
        if (!Array.isArray(parsed) || parsed.some(session =>
          !session || typeof session !== "object" || typeof session.date !== "string"
        )) {
          throw new Error("Invalid session export");
        }

        if (!window.confirm("Replace all existing sessions with this import?")) return;

        saveSessions(parsed);
        const latestSession = [...parsed].reverse().find(session => session.nextTask);
        if (latestSession) {
          localStorage.setItem(NEXT_TASK_KEY, latestSession.nextTask);
        } else {
          localStorage.removeItem(NEXT_TASK_KEY);
        }
        updateFirstTask();
        selectedDate = null;
        renderCalendar();
      } catch (error) {
        window.alert("Could not import this file. Choose a valid SessionZero JSON export.");
      }
    });

    document.getElementById("exportButton").addEventListener("click", () => {
      const sessions = getSessions();
      const blob = new Blob([JSON.stringify(sessions, null, 2)], {
        type: "application/json"
      });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "sessionzero-sessions.json";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    });

    updateFirstTask();

    if (timer) {
      timerGoal.textContent = timer.goal;
      pauseButton.textContent = timer.paused ? "Resume" : "Pause";
      showScreen("timer");
      startClock();
    } else {
      showScreen("start");
    }

    renderCalendar();
  </script>
</body>
</html>
